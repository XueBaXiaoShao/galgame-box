[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-galgame-box"
version = "0.1.0"
description = "Galgame百宝盒（NoneBot 版）：整合 VNDB / TouchGal / AnimeTrace 的 Galgame 查询、推荐、下载与角色识别插件"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "nonebot2[fastapi]>=2.4.0",
    "nonebot-adapter-onebot>=2.4.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.0",
    "Pillow>=10.0",
    "eval_type_backport>=0.2.0; python_version < '3.10'",
]

[project.optional-dependencies]
cf = ["curl_cffi>=0.7"]

[tool.setuptools]
packages = ["galgame_box"]
